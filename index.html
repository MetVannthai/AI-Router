<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AI Router</title>
    <style>
      :root {
        --bg: #f3f5f8;
        --surface: #ffffff;
        --surface-2: #eef2f6;
        --text: #17202a;
        --muted: #66717f;
        --line: #dfe5eb;
        --accent: #216e63;
        --accent-strong: #18564e;
        --accent-soft: #dff2ed;
        --danger: #bb3d4b;
        --shadow: 0 18px 55px rgba(22, 35, 47, 0.11);
        --radius: 16px;
      }
      [data-theme="dark"] {
        --bg: #151b21;
        --surface: #202830;
        --surface-2: #2a343e;
        --text: #edf3f5;
        --muted: #a6b2bc;
        --line: #3a4651;
        --accent: #74d3ba;
        --accent-strong: #9ae2ce;
        --accent-soft: #25483f;
        --danger: #ff8790;
        --shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent);
        outline-offset: 2px;
      }
      .hidden {
        display: none !important;
      }
      .screen {
        min-height: 100vh;
      }

      .auth-screen {
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 14% 12%,
            rgba(53, 161, 139, 0.18),
            transparent 30%
          ),
          radial-gradient(
            circle at 90% 90%,
            rgba(238, 172, 83, 0.16),
            transparent 28%
          ),
          var(--bg);
      }
      .auth-card {
        width: min(100%, 430px);
        padding: 42px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        color: white;
        background: var(--accent);
        border-radius: 14px;
        box-shadow: 0 8px 18px rgba(33, 110, 99, 0.25);
      }
      .brand-mark svg {
        width: 28px;
        height: 28px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        margin-bottom: 6px;
        font-size: 27px;
        letter-spacing: -0.7px;
      }
      h2 {
        margin-bottom: 5px;
        font-size: 24px;
        letter-spacing: -0.5px;
      }
      .muted {
        color: var(--muted);
      }
      .auth-card > .muted {
        margin-bottom: 26px;
      }
      .form-field {
        display: grid;
        gap: 7px;
        margin-bottom: 17px;
      }
      label {
        font-size: 13px;
        font-weight: 700;
      }
      input,
      select {
        width: 100%;
        padding: 12px 13px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      input::placeholder {
        color: var(--muted);
      }
      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
        outline: 0;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 10px;
        min-height: 42px;
        padding: 0 16px;
        font-weight: 700;
        transition:
          transform 0.18s,
          background 0.18s,
          border-color 0.18s;
      }
      .button:hover {
        transform: translateY(-1px);
      }
      .button-primary {
        color: white;
        background: var(--accent);
      }
      .button-primary:hover {
        background: var(--accent-strong);
      }
      .button-secondary {
        color: var(--text);
        background: var(--surface-2);
        border-color: var(--line);
      }
      .button-ghost {
        color: var(--muted);
        background: transparent;
        padding-inline: 9px;
      }
      .button-danger {
        color: var(--danger);
        background: transparent;
        border-color: color-mix(in srgb, var(--danger) 30%, var(--line));
      }
      .full {
        width: 100%;
      }
      .auth-switch {
        margin: 23px 0 0;
        text-align: center;
        font-size: 13px;
      }
      .auth-choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 24px;
        padding: 4px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .auth-choice {
        min-height: 38px;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 8px;
        font-weight: 700;
      }
      .auth-choice.active {
        color: var(--text);
        background: var(--surface);
        box-shadow: 0 2px 8px rgba(16, 31, 28, 0.08);
      }
      .text-button {
        color: var(--accent);
        background: none;
        border: 0;
        font-weight: 700;
        padding: 0;
      }
      .error {
        min-height: 20px;
        margin: -5px 0 12px;
        color: var(--danger);
        font-size: 13px;
        font-weight: 600;
      }
      .pin-row {
        display: flex;
        gap: 9px;
        margin: 12px 0 14px;
      }
      .pin-input {
        width: 100%;
        min-width: 0;
        height: 54px;
        padding: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        border-radius: 11px;
      }
      .pin-input[type="password"] {
        -webkit-text-security: disc;
      }
      .pin-tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: -4px;
        margin-bottom: 20px;
        color: var(--muted);
        font-size: 12px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 500;
      }
      .check input {
        width: auto;
        accent-color: var(--accent);
      }

      .app-shell {
        min-height: 100vh;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        max-width: 1200px;
        margin: auto;
        padding: 21px 28px;
      }
      .topbar .brand {
        margin: 0;
      }
      .topbar .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 11px;
      }
      .topbar .brand-mark svg {
        width: 23px;
        height: 23px;
      }
      .topbar h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: -0.3px;
      }
      .topbar-actions,
      .user-chip {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-chip {
        padding: 7px 11px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 13px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        color: white;
        background: var(--accent);
        border-radius: 50%;
        font-size: 11px;
        font-weight: 800;
      }
      .icon-button {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .icon-button svg {
        width: 18px;
        height: 18px;
      }
      main {
        max-width: 1200px;
        margin: auto;
        padding: 35px 28px 72px;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 28px;
      }
      .intro h2 {
        margin-bottom: 3px;
      }
      .intro p {
        margin: 0;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }
      .search-box {
        flex: 1 1 260px;
        position: relative;
      }
      .search-box input {
        padding-left: 39px;
      }
      .search-box svg {
        position: absolute;
        left: 13px;
        top: 50%;
        width: 17px;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }
      .select-wrap {
        min-width: 150px;
      }
      .view-toggle {
        display: flex;
        margin-left: auto;
        padding: 3px;
        background: var(--surface-2);
        border-radius: 10px;
      }
      .view-toggle button {
        width: 36px;
        height: 34px;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 7px;
      }
      .view-toggle button.active {
        color: var(--text);
        background: var(--surface);
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
      }
      .record-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 15px;
      }
      .record-grid.list-view {
        grid-template-columns: 1fr;
      }
      .record-card {
        position: relative;
        min-width: 0;
        padding: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 5px 16px rgba(26, 41, 54, 0.04);
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          border-color 0.2s;
      }
      .record-card:hover {
        transform: translateY(-3px);
        border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
        box-shadow: 0 12px 26px rgba(26, 41, 54, 0.1);
      }
      .record-card a {
        display: block;
        color: inherit;
        text-decoration: none;
      }
      .record-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 13px;
        margin-bottom: 21px;
      }
      .record-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        flex: 0 0 auto;
        color: var(--icon-color, var(--accent));
        background: color-mix(
          in srgb,
          var(--icon-color, var(--accent)) 13%,
          transparent
        );
        border-radius: 14px;
      }
      .record-icon svg {
        width: 32px;
        height: 32px;
      }
      .record-actions {
        display: flex;
        gap: 2px;
        opacity: 0.7;
      }
      .record-actions button {
        display: grid;
        place-items: center;
        width: 31px;
        height: 31px;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 7px;
      }
      .record-actions button:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .record-actions button.delete:hover {
        color: var(--danger);
      }
      .record-actions svg {
        width: 16px;
        height: 16px;
      }
      .record-card h3 {
        overflow: hidden;
        margin: 0 0 4px;
        font-size: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .record-url {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list-view .record-card {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 13px 16px;
      }
      .list-view .record-top {
        margin: 0;
      }
      .list-view .record-card a {
        display: flex;
        align-items: center;
        gap: 17px;
        min-width: 0;
        flex: 1;
      }
      .list-view .record-top .record-icon {
        width: 44px;
        height: 44px;
      }
      .list-view .record-top {
        display: contents;
      }
      .list-view .record-card a > div:last-child {
        min-width: 0;
      }
      .empty-state {
        padding: 60px 20px;
        text-align: center;
        color: var(--muted);
        background: var(--surface);
        border: 1px dashed var(--line);
        border-radius: var(--radius);
      }
      .empty-state svg {
        width: 42px;
        height: 42px;
        margin-bottom: 10px;
        color: var(--accent);
      }
      .empty-state h3 {
        margin-bottom: 5px;
        color: var(--text);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(11, 17, 22, 0.55);
        backdrop-filter: blur(5px);
      }
      .modal {
        width: min(100%, 540px);
        max-height: min(720px, 92vh);
        overflow: auto;
        padding: 26px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        animation: rise 0.22s ease-out;
      }
      .modal-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .modal-head h2 {
        margin-bottom: 0;
        font-size: 21px;
      }
      .close-button {
        color: var(--muted);
        background: transparent;
        border: 0;
        font-size: 25px;
        line-height: 1;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }
      .icon-picker {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
        margin-top: 10px;
      }
      .icon-option {
        display: grid;
        justify-items: center;
        gap: 4px;
        min-width: 0;
        padding: 8px 3px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 10px;
      }
      .icon-option:hover,
      .icon-option.selected {
        color: var(--icon-color, var(--accent));
        border-color: var(--icon-color, var(--accent));
        background: color-mix(
          in srgb,
          var(--icon-color, var(--accent)) 10%,
          transparent
        );
      }
      .icon-option svg {
        width: 25px;
        height: 25px;
      }
      .toast-region {
        position: fixed;
        z-index: 20;
        right: 20px;
        bottom: 20px;
        display: grid;
        gap: 9px;
        width: min(330px, calc(100vw - 40px));
      }
      .toast {
        padding: 12px 15px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 10px;
        box-shadow: var(--shadow);
        animation: toast-in 0.25s ease-out;
      }
      .toast.error {
        border-left-color: var(--danger);
      }
      .shake {
        animation: shake 0.35s ease-in-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateX(12px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-7px);
        }
        40%,
        80% {
          transform: translateX(7px);
        }
      }
      @media (max-width: 620px) {
        .auth-card {
          padding: 30px 22px;
        }
        .topbar {
          padding: 16px;
        }
        .topbar h1 {
          display: none;
        }
        .user-chip {
          max-width: 150px;
          overflow: hidden;
        }
        main {
          padding: 26px 16px 55px;
        }
        .intro {
          align-items: stretch;
          flex-direction: column;
          gap: 15px;
        }
        .intro .button {
          width: 100%;
        }
        .toolbar {
          align-items: stretch;
        }
        .search-box {
          flex-basis: 100%;
        }
        .select-wrap {
          flex: 1;
        }
        .view-toggle {
          margin-left: 0;
        }
        .icon-picker {
          grid-template-columns: repeat(5, 1fr);
        }
        .modal {
          padding: 21px 17px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Client-side PIN login protects casual access only; it cannot protect data from someone with browser developer tools. -->
    <section id="authScreen" class="screen auth-screen">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path
                d="M16 4 27 10.5v11L16 28 5 21.5v-11L16 4Z"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="m10 16 4 4 8-9"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <strong>AI Router</strong>
            <div class="muted" style="font-size: 12px">
              Your personal AI launchpad
            </div>
          </div>
        </div>
        <div id="authContent"></div>
      </div>
    </section>

    <section id="appScreen" class="screen app-shell hidden">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path
                d="M16 4 27 10.5v11L16 28 5 21.5v-11L16 4Z"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="m10 16 4 4 8-9"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <h1>AI Router</h1>
        </div>
        <div class="topbar-actions">
          <div class="user-chip">
            <span id="userAvatar" class="avatar"></span
            ><span id="userLabel"></span>
          </div>
          <button
            id="themeButton"
            class="icon-button"
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
          ></button
          ><button
            id="logoutButton"
            class="button button-secondary"
            type="button"
          >
            Log out
          </button>
        </div>
      </header>
      <main>
        <div class="intro">
          <div>
            <h2>Your AI tools</h2>
            <p id="recordCount">0 tools saved</p>
          </div>
          <button id="addButton" class="button button-primary" type="button">
            <span aria-hidden="true">+</span> Add AI
          </button>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4-4" /></svg
            ><input
              id="searchInput"
              type="search"
              placeholder="Search your AI tools"
              aria-label="Search your AI tools"
            />
          </div>
          <div class="select-wrap">
            <select id="sortSelect" aria-label="Sort tools">
              <option value="newest">Newest first</option>
              <option value="az">A to Z</option>
            </select>
          </div>
          <div class="view-toggle" aria-label="View style">
            <button
              id="gridButton"
              class="active"
              type="button"
              aria-label="Grid view"
              title="Grid view"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="4" y="4" width="6" height="6" />
                <rect x="14" y="4" width="6" height="6" />
                <rect x="4" y="14" width="6" height="6" />
                <rect x="14" y="14" width="6" height="6" />
              </svg></button
            ><button
              id="listButton"
              type="button"
              aria-label="List view"
              title="List view"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M8 6h12M8 12h12M8 18h12" />
                <path d="M4 6h.01M4 12h.01M4 18h.01" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
        <div id="recordGrid" class="record-grid"></div>
      </main>
    </section>

    <div id="modalBackdrop" class="modal-backdrop hidden" role="presentation">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="modal-head">
          <h2 id="modalTitle">Add an AI tool</h2>
          <button
            id="closeModal"
            class="close-button"
            type="button"
            aria-label="Close"
          >
            &times;
          </button>
        </div>
        <form id="recordForm">
          <input id="editingId" type="hidden" />
          <div class="form-field">
            <label for="titleInput">Title</label
            ><input
              id="titleInput"
              required
              maxlength="80"
              autocomplete="off"
              placeholder="e.g. ChatGPT"
            />
            <div id="titleError" class="error"></div>
          </div>
          <div class="form-field">
            <label for="urlInput">Link (AI route)</label
            ><input
              id="urlInput"
              required
              type="url"
              inputmode="url"
              placeholder="https://chatgpt.com"
            />
            <div id="urlError" class="error"></div>
          </div>
          <div class="form-field">
            <label>Icon</label>
            <div
              id="iconPicker"
              class="icon-picker"
              role="radiogroup"
              aria-label="Choose an icon"
            ></div>
            <input id="iconInput" type="hidden" value="ai" />
            <div id="iconError" class="error"></div>
          </div>
          <div class="modal-foot">
            <button
              id="cancelModal"
              class="button button-secondary"
              type="button"
            >
              Cancel</button
            ><button class="button button-primary" type="submit">
              Save tool
            </button>
          </div>
        </form>
      </div>
    </div>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>

    <script>
      "use strict";
      const USERS_KEY = "ai-router-users-v1";
      const RECORDS_KEY = "ai-router-records-v1";
      const SESSION_KEY = "ai-router-session-v1";
      const REMEMBER_KEY = "ai-router-remembered-session-v1";
      const THEME_KEY = "ai-router-theme-v1";
      const LOCK_KEY = "ai-router-lock-v1";
      const INACTIVITY_MS = 15 * 60 * 1000;
      const icons = [
        ["chatgpt", "ChatGPT", "#10a37f"],
        ["claude", "Claude", "#c87955"],
        ["gemini", "Gemini", "#5275e8"],
        ["copilot", "Copilot", "#2878d7"],
        ["perplexity", "Perplexity", "#20a7a0"],
        ["grok", "Grok", "#111827"],
        ["deepseek", "DeepSeek", "#3678d3"],
        ["mistral", "Mistral", "#f0803a"],
        ["midjourney", "Midjourney", "#7b8794"],
        ["stable", "Stable Diffusion", "#8a5cf5"],
        ["huggingface", "Hugging Face", "#eab308"],
        ["poe", "Poe", "#5b49d6"],
        ["notebook", "NotebookLM", "#e05280"],
        ["cursor", "Cursor", "#20252d"],
        ["runway", "Runway", "#eb5b62"],
        ["suno", "Suno", "#cc4e82"],
        ["elevenlabs", "ElevenLabs", "#7c63c9"],
        ["ai", "AI", "#216e63"],
      ];
      const $ = (id) => document.getElementById(id);
      let currentUser = null;
      let records = [];
      let inactivityTimer;
      let visiblePin = false;
      let authMode = "login";

      function readStorage(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (error) {
          return fallback;
        }
      }
      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (error) {
          showToast("Browser storage is unavailable", true);
          return false;
        }
      }
      function getUsers() {
        return readStorage(USERS_KEY, []);
      }
      function getAllRecords() {
        return readStorage(RECORDS_KEY, []);
      }
      function setSession(userId, remember) {
        try {
          const storage = remember ? localStorage : sessionStorage;
          storage.setItem(SESSION_KEY, userId);
          if (remember) sessionStorage.removeItem(SESSION_KEY);
          else localStorage.removeItem(SESSION_KEY);
        } catch (error) {}
      }
      function getSession() {
        try {
          return (
            sessionStorage.getItem(SESSION_KEY) ||
            localStorage.getItem(SESSION_KEY)
          );
        } catch (error) {
          return null;
        }
      }
      function clearSession() {
        try {
          sessionStorage.removeItem(SESSION_KEY);
          localStorage.removeItem(SESSION_KEY);
        } catch (error) {}
      }
      function randomId() {
        return crypto.randomUUID
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }
      function bytesToBase64(bytes) {
        return btoa(String.fromCharCode(...new Uint8Array(bytes)));
      }
      function base64ToBytes(value) {
        return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      }
      async function hashPin(pin, salt) {
        const encoded = new TextEncoder().encode(pin);
        const key = await crypto.subtle.importKey(
          "raw",
          encoded,
          { name: "PBKDF2" },
          false,
          ["deriveBits"],
        );
        const bits = await crypto.subtle.deriveBits(
          { name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
          key,
          256,
        );
        return bytesToBase64(bits);
      }
      async function makePinHash(pin) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        return { salt: bytesToBase64(salt), hash: await hashPin(pin, salt) };
      }
      async function pinMatches(pin, user) {
        return (await hashPin(pin, base64ToBytes(user.salt))) === user.pinHash;
      }
      function validPin(pin) {
        return /^\d{6}$/.test(pin);
      }
      function escapeHtml(value) {
        return String(value).replace(
          /[&<>'"]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[char],
        );
      }
      const iconMarks = {
        chatgpt:
          '<path d="M20 9c3 0 5 2 5 5 3-1 6 1 6 4 0 2-1 4-3 5 1 3-1 6-4 6-2 0-4-1-5-3-2 2-5 2-7 0-2-2-1-5 1-7-2-2-2-5 0-7 2-2 5-2 7 0 0-2 0-3 0-3Z" fill="none"/><path d="m20 14 5 3-1 6-5 3-5-3 1-6 5-3Z" fill="none"/>',
        claude:
          '<path d="m20 7 2.7 9.3L32 20l-9.3 2.7L20 32l-2.7-9.3L8 20l9.3-2.7L20 7Z" fill="none"/>',
        gemini:
          '<path d="M8 20c5-1 9-5 12-12 3 7 7 11 12 12-5 1-9 5-12 12-3-7-7-11-12-12Z" fill="none"/>',
        copilot:
          '<path d="M10 15c0-4 3-7 7-7h3v9h-3c-4 0-7 2-7 6 0 3 2 5 5 5h5V19h-3c-4 0-7-1-7-4Zm20 0c0-4-3-7-7-7h-3v9h3c4 0 7 2 7 6 0 3-2 5-5 5h-5V19h3c4 0 7-1 7-4Z" fill="none"/>',
        perplexity:
          '<path d="M11 30V10h11c5 0 8 3 8 7s-3 7-8 7h-6v6m0-12h6c2 0 3-1 3-3s-1-3-3-3h-6v6Z" fill="none"/>',
        grok: '<path d="M10 10 30 30M30 10 10 30M20 8v24M8 20h24" fill="none"/>',
        deepseek:
          '<path d="M8 22c3-8 10-11 17-7l7 5-7 5c-7 4-14 1-17-3Zm17-4h.01M14 21c1 2 3 3 5 3" fill="none"/>',
        mistral:
          '<path d="M9 12h22M9 18h14M9 24h22M9 30h14M16 12v6M24 24v6" fill="none"/>',
        midjourney:
          '<path d="M9 29c3-10 7-20 11-20s8 10 11 20M13 23h14M16 17h8" fill="none"/>',
        stable:
          '<path d="m20 8 3 8 9 4-9 4-3 8-3-8-9-4 9-4 3-8Z" fill="none"/>',
        huggingface:
          '<path d="M11 22c0-7 4-11 9-11s9 4 9 11M14 20h.01M26 20h.01M15 26c3 2 7 2 10 0" fill="none"/>',
        poe: '<path d="M11 31V9h10c5 0 8 3 8 7s-3 7-8 7h-5m0-6h5c2 0 3-1 3-3s-1-3-3-3h-5" fill="none"/>',
        notebook:
          '<path d="M12 8h16v24H12zM16 14h8M16 20h8M16 26h5" fill="none"/>',
        cursor:
          '<path d="m10 8 20 13-9 2-4 9L10 8Z" fill="white" stroke="none"/>',
        runway:
          '<path d="M11 31V9h9c5 0 8 3 8 7s-3 7-8 7h-9m0-7h9c2 0 3-1 3-3s-1-3-3-3h-4v15" fill="none"/>',
        suno: '<path d="M20 9a11 11 0 1 0 0 22 11 11 0 0 0 0-22Zm0 6a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z" fill="none"/>',
        elevenlabs:
          '<path d="M12 9h5v22h-5zM23 9h5v22h-5zM8 14h2M30 14h2M8 26h2M30 26h2" fill="none"/>',
        ai: '<path d="m20 8 3 8 9 4-9 4-3 8-3-8-9-4 9-4 3-8Z" fill="none"/>',
      };
      function iconSvg(key) {
        const found =
          icons.find((item) => item[0] === key) || icons[icons.length - 1];
        const knot =
          '<path d="M20 7.5c3 0 5.6 1.8 6.6 4.4 2.7-.2 5.2 1.2 6.6 3.6 1.5 2.6.9 5.7-1.3 7.5 1.4 2.3 1.4 5.1 0 7.5-1.5 2.5-4.3 3.8-7 3.5-1.2 2.5-3.9 4.2-6.7 4.2-3 0-5.6-1.8-6.6-4.4-2.7.2-5.2-1.2-6.6-3.6-1.5-2.6-.9-5.7 1.3-7.5-1.4-2.3-1.4-5.1 0-7.5 1.5-2.5 4.3-3.8 7-3.5 1.2-2.5 3.9-4.2 6.7-4.2Z" fill="none"/><path d="m12 16 8 4 8-4M12 24l8-4 8 4M20 11v9m0 0v9" fill="none"/>';
        const mark =
          found[0] === "chatgpt" ? knot : iconMarks[found[0]] || iconMarks.ai;
        const background = found[0] === "chatgpt" ? "#111111" : found[2];
        return `<svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="${background}"/><g stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${mark}</g></svg>`;
      }
      function iconData(key) {
        return icons.find((item) => item[0] === key) || icons[icons.length - 1];
      }

      function renderAuth() {
        const hasUsers = getUsers().length > 0;
        if (!hasUsers) authMode = "register";
        const register = authMode === "register";
        $("authContent").innerHTML =
          `<div class="auth-choices" role="tablist" aria-label="Account access"><button id="loginChoice" class="auth-choice ${register ? "" : "active"}" type="button" role="tab" aria-selected="${!register}">Log in</button><button id="registerChoice" class="auth-choice ${register ? "active" : ""}" type="button" role="tab" aria-selected="${register}">Create account</button></div><h1>${register ? "Set up your router" : "Welcome back"}</h1><p class="muted">${register ? "Create a profile to keep your AI tools organized." : "Enter your PIN to open your AI launchpad."}</p>${register ? `<div class="form-field"><label for="nameInput">Name or username</label><input id="nameInput" autocomplete="username" maxlength="40" placeholder="e.g. Alex"></div>` : `<div class="form-field"><label for="loginNameInput">Username</label><input id="loginNameInput" autocomplete="username" placeholder="Your username"></div>`}<div class="form-field"><label>${register ? "Create a 6-digit PIN" : "6-digit PIN"}</label><div id="authPinRow" class="pin-row" data-pin-row="auth"></div><div id="authPinError" class="error" role="alert"></div></div>${register ? `<div class="form-field"><label>Confirm PIN</label><div id="confirmPinRow" class="pin-row" data-pin-row="confirm"></div><div id="confirmPinError" class="error" role="alert"></div></div>` : `<div class="pin-tools"><label class="check"><input id="rememberInput" type="checkbox"> Remember me</label><button id="showPinButton" class="text-button" type="button">Show PIN</button></div>`}<button id="authSubmit" class="button button-primary full" type="button">${register ? "Create account" : "Log in"}</button>`;
        makePinInputs($("authPinRow"));
        if (register) makePinInputs($("confirmPinRow"));
        $("authSubmit").addEventListener(
          "click",
          register ? registerUser : loginUser,
        );
        const switchAuth = (mode) => {
          authMode = mode;
          renderAuth();
        };
        $("loginChoice").addEventListener("click", () => switchAuth("login"));
        $("registerChoice").addEventListener("click", () => switchAuth("register"));
        $("loginChoice").addEventListener("keydown", (event) => {
          if (event.key === "ArrowRight") $("registerChoice").focus();
        });
        $("registerChoice").addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft") $("loginChoice").focus();
        });
        if (!register)
          $("showPinButton").addEventListener("click", togglePinVisibility);
        const first = $(register ? "nameInput" : "loginNameInput");
        if (first) first.focus();
      }
      function makePinInputs(container) {
        for (let index = 0; index < 6; index++) {
          const input = document.createElement("input");
          input.className = "pin-input";
          input.type = visiblePin ? "text" : "password";
          input.inputMode = "numeric";
          input.maxLength = 1;
          input.pattern = "[0-9]";
          input.autocomplete = index === 0 ? "one-time-code" : "off";
          input.setAttribute("aria-label", `PIN digit ${index + 1}`);
          input.addEventListener("input", (event) => {
            event.target.value = event.target.value
              .replace(/\D/g, "")
              .slice(-1);
            if (event.target.value && index < 5)
              container.children[index + 1].focus();
          });
          input.addEventListener("keydown", (event) => {
            if (event.key === "Backspace" && !event.target.value && index > 0)
              container.children[index - 1].focus();
          });
          input.addEventListener("paste", (event) => {
            const pasted = (event.clipboardData || window.clipboardData)
              .getData("text")
              .replace(/\D/g, "")
              .slice(0, 6);
            if (pasted) {
              event.preventDefault();
              [...pasted].forEach((digit, pastedIndex) => {
                if (container.children[pastedIndex])
                  container.children[pastedIndex].value = digit;
              });
              container.children[Math.min(pasted.length, 5)].focus();
            }
          });
          container.appendChild(input);
        }
      }
      function pinFrom(rowId) {
        return [...$(rowId).querySelectorAll("input")]
          .map((input) => input.value)
          .join("");
      }
      function togglePinVisibility() {
        visiblePin = !visiblePin;
        document
          .querySelectorAll(".pin-input")
          .forEach((input) => (input.type = visiblePin ? "text" : "password"));
        if ($("showPinButton"))
          $("showPinButton").textContent = visiblePin ? "Hide PIN" : "Show PIN";
      }
      function setAuthError(id, message) {
        if ($(id)) $(id).textContent = message;
      }
      function lockState() {
        return readStorage(LOCK_KEY, { failures: 0, until: 0 });
      }
      async function registerUser() {
        const name = $("nameInput").value.trim();
        const pin = pinFrom("authPinRow");
        const confirm = pinFrom("confirmPinRow");
        setAuthError("authPinError", "");
        setAuthError("confirmPinError", "");
        if (!name) {
          $("nameInput").focus();
          return;
        }
        if (!validPin(pin)) {
          setAuthError("authPinError", "PIN must be exactly 6 digits");
          $("authPinRow").classList.add("shake");
          setTimeout(() => $("authPinRow").classList.remove("shake"), 400);
          return;
        }
        if (pin !== confirm) {
          setAuthError("confirmPinError", "PINs do not match");
          return;
        }
        const users = getUsers();
        if (
          users.some((user) => user.name.toLowerCase() === name.toLowerCase())
        ) {
          $("nameInput").focus();
          showToast("That username is already in use", true);
          return;
        }
        const pinData = await makePinHash(pin);
        const user = {
          id: randomId(),
          name,
          pinHash: pinData.hash,
          salt: pinData.salt,
          createdAt: new Date().toISOString(),
        };
        users.push(user);
        if (writeStorage(USERS_KEY, users)) {
          showToast("Profile created");
          signIn(user, false);
        }
      }
      async function loginUser() {
        const name = $("loginNameInput").value.trim();
        const pin = pinFrom("authPinRow");
        setAuthError("authPinError", "");
        const lock = lockState();
        if (lock.until > Date.now()) {
          const seconds = Math.ceil((lock.until - Date.now()) / 1000);
          setAuthError(
            "authPinError",
            `Too many attempts. Try again in ${seconds}s.`,
          );
          return;
        }
        if (!validPin(pin)) {
          setAuthError("authPinError", "PIN must be exactly 6 digits");
          $("authPinRow").classList.add("shake");
          setTimeout(() => $("authPinRow").classList.remove("shake"), 400);
          return;
        }
        const user = getUsers().find(
          (item) => item.name.toLowerCase() === name.toLowerCase(),
        );
        if (!user || !(await pinMatches(pin, user))) {
          const failures = lock.failures + 1;
          const duration =
            failures >= 5
              ? 30000 * Math.pow(2, Math.floor((failures - 5) / 3))
              : 0;
          writeStorage(LOCK_KEY, {
            failures,
            until: duration ? Date.now() + duration : 0,
          });
          setAuthError(
            "authPinError",
            duration
              ? `Too many wrong attempts. Try again in ${Math.ceil(duration / 1000)}s.`
              : "Wrong PIN",
          );
          $("authPinRow").classList.add("shake");
          setTimeout(() => $("authPinRow").classList.remove("shake"), 400);
          return;
        }
        writeStorage(LOCK_KEY, { failures: 0, until: 0 });
        signIn(user, $("rememberInput").checked);
      }
      function signIn(user, remember) {
        currentUser = user;
        setSession(user.id, remember);
        records = getAllRecords().filter((record) => record.userId === user.id);
        $("authScreen").classList.add("hidden");
        $("appScreen").classList.remove("hidden");
        $("userLabel").textContent = user.name;
        $("userAvatar").textContent = user.name.slice(0, 1).toUpperCase();
        renderRecords();
        resetInactivity();
      }
      function logout(message = "Logged out") {
        clearSession();
        currentUser = null;
        records = [];
        clearTimeout(inactivityTimer);
        $("appScreen").classList.add("hidden");
        $("authScreen").classList.remove("hidden");
        renderAuth();
        showToast(message);
      }
      function resetInactivity() {
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(
          () => logout("Logged out after 15 minutes of inactivity"),
          INACTIVITY_MS,
        );
      }

      function renderRecords() {
        const query = $("searchInput").value.trim().toLowerCase();
        const sort = $("sortSelect").value;
        const filtered = records
          .filter(
            (record) =>
              record.title.toLowerCase().includes(query) ||
              record.url.toLowerCase().includes(query),
          )
          .sort((a, b) =>
            sort === "az"
              ? a.title.localeCompare(b.title)
              : new Date(b.createdAt) - new Date(a.createdAt),
          );
        $("recordCount").textContent =
          `${records.length} ${records.length === 1 ? "tool" : "tools"} saved${query ? `, ${filtered.length} shown` : ""}`;
        if (!filtered.length) {
          $("recordGrid").innerHTML =
            `<div class="empty-state" style="grid-column:1/-1">${records.length ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><h3>No matching tools</h3><p>Try a different title or URL.</p>` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v16M4 12h16" stroke-linecap="round"/></svg><h3>Your AI shelf is empty</h3><p>Add your first AI route to get started.</p>`}</div>`;
          return;
        }
        $("recordGrid").innerHTML = filtered
          .map((record) => {
            const icon = iconData(record.icon);
            return `<article class="record-card"><a href="${escapeHtml(record.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(record.title)}"><div class="record-top"><span class="record-icon" style="--icon-color:${icon[2]}">${iconSvg(record.icon)}</span><div class="record-actions"><button type="button" class="edit" data-edit="${record.id}" aria-label="Edit ${escapeHtml(record.title)}" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 20 4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L6.5 16 4 20Z"/><path d="m14 6 3 3"/></svg></button><button type="button" class="delete" data-delete="${record.id}" aria-label="Delete ${escapeHtml(record.title)}" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div></div><div><h3>${escapeHtml(record.title)}</h3><span class="record-url">${escapeHtml(shortUrl(record.url))}</span></div></a></article>`;
          })
          .join("");
      }
      function shortUrl(url) {
        try {
          const parsed = new URL(url);
          return parsed.hostname + parsed.pathname.replace(/\/$/, "");
        } catch (error) {
          return url;
        }
      }
      function openModal(record = null) {
        $("modalTitle").textContent = record
          ? "Edit AI tool"
          : "Add an AI tool";
        $("editingId").value = record ? record.id : "";
        $("titleInput").value = record ? record.title : "";
        $("urlInput").value = record ? record.url : "";
        $("iconInput").value = record ? record.icon : "ai";
        ["titleError", "urlError", "iconError"].forEach(
          (id) => ($(id).textContent = ""),
        );
        renderIconPicker();
        $("modalBackdrop").classList.remove("hidden");
        setTimeout(() => $("titleInput").focus(), 0);
      }
      function closeModal() {
        $("modalBackdrop").classList.add("hidden");
      }
      function renderIconPicker() {
        $("iconPicker").innerHTML = icons
          .map(
            (icon) =>
              `<button type="button" class="icon-option ${$("iconInput").value === icon[0] ? "selected" : ""}" style="--icon-color:${icon[2]}" data-icon="${icon[0]}" role="radio" aria-checked="${$("iconInput").value === icon[0]}">${iconSvg(icon[0])}<span>${escapeHtml(icon[1])}</span></button>`,
          )
          .join("");
        document.querySelectorAll("[data-icon]").forEach((button) =>
          button.addEventListener("click", () => {
            $("iconInput").value = button.dataset.icon;
            renderIconPicker();
          }),
        );
      }
      function saveRecord(event) {
        event.preventDefault();
        const title = $("titleInput").value.trim();
        const url = $("urlInput").value.trim();
        const icon = $("iconInput").value;
        $("titleError").textContent = title ? "" : "Title is required";
        let parsed;
        try {
          parsed = new URL(url);
        } catch (error) {}
        $("urlError").textContent =
          parsed && ["http:", "https:"].includes(parsed.protocol)
            ? ""
            : "Enter a valid http:// or https:// link";
        if (!title || !parsed || !["http:", "https:"].includes(parsed.protocol))
          return;
        const now = new Date().toISOString();
        const id = $("editingId").value;
        if (id) {
          const record = records.find((item) => item.id === id);
          Object.assign(record, {
            title,
            url: parsed.href,
            icon,
            updatedAt: now,
          });
          showToast("Updated");
        } else {
          records.unshift({
            id: randomId(),
            userId: currentUser.id,
            title,
            url: parsed.href,
            icon,
            createdAt: now,
            updatedAt: now,
          });
          showToast("Added");
        }
        persistRecords();
        closeModal();
        renderRecords();
      }
      function persistRecords() {
        const otherRecords = getAllRecords().filter(
          (record) => record.userId !== currentUser.id,
        );
        writeStorage(RECORDS_KEY, [...otherRecords, ...records]);
      }
      function deleteRecord(id) {
        const record = records.find((item) => item.id === id);
        if (!record || !confirm(`Delete ${record.title}?`)) return;
        records = records.filter((item) => item.id !== id);
        persistRecords();
        renderRecords();
        showToast("Deleted");
      }
      function showToast(message, error = false) {
        const toast = document.createElement("div");
        toast.className = `toast${error ? " error" : ""}`;
        toast.textContent = message;
        $("toastRegion").appendChild(toast);
        setTimeout(() => toast.remove(), 3200);
      }
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (error) {}
        $("themeButton").innerHTML =
          theme === "dark"
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3a8.5 8.5 0 1 0 11.5 11.5Z"/></svg>`;
      }

      $("addButton").addEventListener("click", () => openModal());
      $("closeModal").addEventListener("click", closeModal);
      $("cancelModal").addEventListener("click", closeModal);
      $("recordForm").addEventListener("submit", saveRecord);
      $("modalBackdrop").addEventListener("click", (event) => {
        if (event.target === $("modalBackdrop")) closeModal();
      });
      $("searchInput").addEventListener("input", renderRecords);
      $("sortSelect").addEventListener("change", renderRecords);
      $("gridButton").addEventListener("click", () => {
        $("recordGrid").classList.remove("list-view");
        $("gridButton").classList.add("active");
        $("listButton").classList.remove("active");
      });
      $("listButton").addEventListener("click", () => {
        $("recordGrid").classList.add("list-view");
        $("listButton").classList.add("active");
        $("gridButton").classList.remove("active");
      });
      $("logoutButton").addEventListener("click", () => logout());
      $("themeButton").addEventListener("click", () =>
        setTheme(
          document.documentElement.dataset.theme === "dark" ? "light" : "dark",
        ),
      );
      $("recordGrid").addEventListener("click", (event) => {
        const edit = event.target.closest("[data-edit]");
        const del = event.target.closest("[data-delete]");
        if (edit) {
          event.preventDefault();
          openModal(records.find((record) => record.id === edit.dataset.edit));
        }
        if (del) {
          event.preventDefault();
          deleteRecord(del.dataset.delete);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          !$("modalBackdrop").classList.contains("hidden")
        )
          closeModal();
      });
      ["click", "keydown", "touchstart"].forEach((type) =>
        document.addEventListener(
          type,
          () => {
            if (currentUser) resetInactivity();
          },
          { passive: true },
        ),
      );
      (function init() {
        let savedTheme = "light";
        try {
          savedTheme =
            localStorage.getItem(THEME_KEY) ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
        } catch (error) {}
        setTheme(savedTheme);
        const sessionUser = getUsers().find((user) => user.id === getSession());
        if (sessionUser) signIn(sessionUser, true);
        else renderAuth();
      })();
    </script>
  </body>
</html>
